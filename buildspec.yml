version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - pip install -r requirements.txt

  build:
    commands:
      - python train.py
      - aws s3 cp model.pkl s3://telecom-mlops-model-storage/telecom_tower_model.pkl

artifacts:
  files:
    - telecom_tower_model.pkl
